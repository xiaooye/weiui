name: Cloudflare OpenNext Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'repair/cloudflare-opennext'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve pinned Cloudflare toolchain
        run: pnpm install --no-frozen-lockfile

      - name: Verify pinned versions
        run: |
          pnpm --filter @weiui/docs exec opennextjs-cloudflare --version
          pnpm --filter @weiui/docs exec wrangler --version

      - name: Verify Cloudflare production build
        run: pnpm --filter @weiui/docs run cf:build

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "build: resolve pinned Cloudflare toolchain"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
