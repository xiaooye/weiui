name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    name: Build, Test & Runtime Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce Civaria brand boundary
        run: pnpm check:brand
      - name: Enforce package boundaries
        run: pnpm check:boundaries
      - name: Build all packages and docs
        run: pnpm build
      - name: Run package unit and adapter contract tests
        run: pnpm turbo run test --filter='!@civaria/docs'
      - name: Run docs tests with known registry timeout allowance
        # build-registry is a pre-existing CPU-bound suite that intermittently
        # exceeds Vitest's 5s default on hosted runners. Keep product logic and
        # the local test contract unchanged; CI only gives the suite headroom.
        run: pnpm --filter @civaria/docs exec vitest run --testTimeout 15000
      - name: Verify required cross-runtime parity
        run: pnpm check:parity
      - name: Verify SSR/import safety
        run: pnpm check:ssr
      - name: Verify public consumption fixtures
        run: pnpm check:fixtures
      - name: Validate token contrast (WCAG AAA/AA)
        run: pnpm --filter @civaria/tokens validate
      - name: Smoke Civaria CLI
        run: node packages/cli/dist/index.js --help
      - name: Smoke Civaria MCP CLI
        run: node packages/mcp/dist/index.js --help
      - name: Check bundle sizes
        run: |
          echo "=== Package sizes ==="
          wc -c packages/tokens/dist/tokens.css
          wc -c packages/css/dist/civaria.css packages/css/dist/civaria.min.css
          wc -c packages/core/dist/index.js
          wc -c packages/headless/dist/index.js
          wc -c packages/react/dist/index.js
          wc -c packages/vue/dist/index.js
          wc -c packages/solid/dist/index.js
          wc -c packages/svelte/dist/index.js
          wc -c packages/elements/dist/index.js
          wc -c packages/icons/dist/index.js packages/icons/dist/react.js packages/icons/dist/vue.js packages/icons/dist/solid.js
          wc -c packages/a11y/dist/index.js
          wc -c packages/cli/dist/index.js
          wc -c packages/mcp/dist/index.js

  docs-cloudflare:
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    name: Docs Cloudflare Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build docs through OpenNext Cloudflare
        run: pnpm --filter @civaria/docs run cf:build

  typecheck:
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    name: Type & Source Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build source and declaration surfaces
        run: |
          pnpm --filter @civaria/tokens build
          pnpm --filter @civaria/css build
          pnpm --filter @civaria/core build
          pnpm --filter @civaria/headless build
          pnpm --filter civaria build
          pnpm --filter @civaria/a11y build
      - name: Strict checks for migration-owned typed packages
        run: |
          pnpm exec tsc -p packages/core/tsconfig.json --noEmit
          (cd packages/headless && pnpm exec tsc --noEmit)
          (cd packages/a11y && pnpm exec tsc --noEmit)
      - name: Native runtime source checks
        run: |
          pnpm --filter @civaria/vue typecheck
          pnpm --filter @civaria/solid typecheck
          pnpm --filter @civaria/svelte typecheck
          pnpm --filter @civaria/elements typecheck
          pnpm check:boundaries
          pnpm check:brand
