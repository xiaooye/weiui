name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    name: Build, Test & Runtime Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce package boundaries
        run: pnpm check:boundaries
      - name: Build all packages and docs
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/weiui-build.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Surface build diagnostics
        if: steps.build.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('/tmp/weiui-build.log', 'utf8').split('\n').slice(-240).join('\n').replace(/```/g, '``\\`');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `<!-- runtime-build-diagnostics -->\nBuild diagnostics for ${context.sha}:\n\n\`\`\`text\n${tail}\n\`\`\`` });
      - name: Fail build gate
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
      - name: Run unit and adapter contract tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/weiui-tests.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Surface test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('/tmp/weiui-tests.log', 'utf8').split('\n').slice(-240).join('\n').replace(/```/g, '``\\`');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `<!-- runtime-test-diagnostics -->\nTest diagnostics for ${context.sha}:\n\n\`\`\`text\n${tail}\n\`\`\`` });
      - name: Fail test gate
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
      - name: Verify required cross-runtime parity
        run: pnpm check:parity
      - name: Verify SSR/import safety
        run: pnpm check:ssr
      - name: Verify public consumption fixtures
        run: pnpm check:fixtures
      - name: Validate token contrast (WCAG AAA/AA)
        run: pnpm --filter @weiui/tokens validate
      - name: Check bundle sizes
        run: |
          echo "=== Package sizes ==="
          wc -c packages/tokens/dist/tokens.css
          wc -c packages/css/dist/weiui.css packages/css/dist/weiui.min.css
          wc -c packages/core/dist/index.js
          wc -c packages/headless/dist/index.js
          wc -c packages/react/dist/index.js
          wc -c packages/vue/dist/index.js
          wc -c packages/solid/dist/index.js
          wc -c packages/svelte/dist/index.js
          wc -c packages/elements/dist/index.js
          wc -c packages/icons/dist/index.js packages/icons/dist/react.js packages/icons/dist/vue.js packages/icons/dist/solid.js
          wc -c packages/a11y/dist/index.js
          wc -c packages/cli/dist/index.js
          wc -c packages/mcp/dist/index.js

  typecheck:
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    name: Type & Source Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TypeScript strict checks
        id: strict
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm exec tsc -p packages/core/tsconfig.json --noEmit
            cd packages/headless && pnpm exec tsc --noEmit
            cd ../react && pnpm exec tsc --noEmit
            cd ../a11y && pnpm exec tsc --noEmit
            cd ../tokens && pnpm exec tsc --noEmit
          } 2>&1 | tee /tmp/weiui-strict.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Surface strict type diagnostics
        if: steps.strict.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('/tmp/weiui-strict.log', 'utf8').split('\n').slice(-260).join('\n').replace(/```/g, '``\\`');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `<!-- runtime-strict-diagnostics -->\nStrict type diagnostics for ${context.sha}:\n\n\`\`\`text\n${tail}\n\`\`\`` });
      - name: Fail strict type gate
        if: steps.strict.outputs.exit_code != '0'
        run: exit 1
      - name: Native runtime source checks
        run: |
          pnpm --filter @weiui/vue typecheck
          pnpm --filter @weiui/solid typecheck
          pnpm --filter @weiui/svelte typecheck
          pnpm --filter @weiui/elements typecheck
          pnpm check:boundaries
