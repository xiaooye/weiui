name: Runtime migration diagnostics

on:
  push:
    branches: [feat/multi-framework-runtime-main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/weiui-build.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Comment diagnostics
        if: steps.build.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/weiui-build.log', 'utf8').split('\n');
            const tail = lines.slice(-180).join('\n').replace(/```/g, '``\\`');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 39,
              body: `<!-- runtime-diagnostics -->\nTemporary runtime build diagnostics for ${context.sha}:\n\n\`\`\`text\n${tail}\n\`\`\``
            });
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
