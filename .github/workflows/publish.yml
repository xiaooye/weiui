name: Publish

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-civaria-registry.mjs"
      - "scripts/check-civaria-legacy.mjs"
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  bootstrap-civaria-name:
    name: Bootstrap civaria@0.0.1 once (temporary)
    if: github.event_name == 'pull_request' && github.head_ref == 'rename/civaria'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b661c0dc10d0cf78fc7014b1070bc1da7fa5d5ac

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify exact frozen bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b661c0dc10d0cf78fc7014b1070bc1da7fa5d5ac"
          node <<'NODE'
          const p = require('./bootstrap/civaria/package.json');
          if (p.name !== 'civaria') throw new Error(`Unexpected package name: ${p.name}`);
          if (p.version !== '0.0.1') throw new Error(`Unexpected bootstrap version: ${p.version}`);
          const repo = typeof p.repository === 'string' ? p.repository : p.repository?.url;
          if (!String(repo).includes('xiaooye/weiui')) throw new Error(`Unexpected repository: ${repo}`);
          NODE
          (cd bootstrap/civaria && npm pack --dry-run --json > /dev/null)

      - name: Probe existing bootstrap version
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(npm view civaria@0.0.1 version 2>/dev/null || true)" = "0.0.1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish only the frozen bootstrap package
        if: steps.bootstrap.outputs.exists == 'false'
        working-directory: bootstrap/civaria
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is unavailable; refusing to publish bootstrap package."
            exit 1
          fi
          npm publish --access public

      - name: Verify public registry after bootstrap
        shell: bash
        run: |
          set -euo pipefail
          version=""
          for _ in $(seq 1 12); do
            version="$(npm view civaria@0.0.1 version 2>/dev/null || true)"
            [ "$version" = "0.0.1" ] && break
            sleep 5
          done
          [ "$version" = "0.0.1" ] || { echo "npm registry still does not confirm civaria@0.0.1"; exit 1; }
          repo="$(npm view civaria@0.0.1 repository.url 2>/dev/null || true)"
          case "$repo" in
            *xiaooye/weiui*) ;;
            *) echo "Unexpected civaria@0.0.1 repository metadata: $repo"; exit 1 ;;
          esac
          echo "civaria@0.0.1 registry bootstrap verified."

  preflight:
    name: npm Package Preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Civaria brand boundary
        run: pnpm check:brand

      - name: Build packages
        run: pnpm build

      - name: Verify npm registry ownership and target availability
        id: registry
        continue-on-error: true
        run: node scripts/check-civaria-registry.mjs

      - name: Validate npm dry-run tarballs for every publishable package
        run: pnpm -r --filter "./packages/**" exec npm pack --dry-run --json > /dev/null

      - name: Validate expected public exports
        run: |
          test -f packages/react/dist/index.js
          test -f packages/react/dist/index.d.ts
          test -f packages/react/dist/editor-entry.js
          test -f packages/react/dist/chart-entry.js
          test -f packages/react/dist/data-table-entry.js
          test -f packages/tokens/dist/index.js
          test -f packages/tokens/dist/index.d.ts
          test -f packages/tokens/dist/tokens.css
          test -f packages/tokens/dist/tokens.json
          test -f packages/css/dist/civaria.css

      - name: Pack publish artifacts and reject workspace protocol leaks
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/civaria-packs"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            PRIVATE=$(node -e 'const p=require(process.argv[1]); process.stdout.write(String(Boolean(p.private)))' "./$dir/package.json")
            [ "$PRIVATE" = "true" ] && continue
            (cd "$dir" && pnpm pack --pack-destination "$PACK_DIR" >/dev/null)
          done
          COUNT=$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' | wc -l)
          [ "$COUNT" -ge 13 ] || { echo "Expected at least 13 publishable Civaria tarballs, got $COUNT"; exit 1; }
          for archive in "$PACK_DIR"/*.tgz; do
            if tar -xOf "$archive" package/package.json | grep -F 'workspace:'; then
              echo "Workspace protocol leaked into $archive"
              exit 1
            fi
          done
          echo "Packed $COUNT publishable Civaria packages without workspace protocol leaks."

      - name: Install packed Civaria packages in a clean consumer
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/civaria-packs"
          CONSUMER="$RUNNER_TEMP/civaria-consumer"
          rm -rf "$CONSUMER"
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install "$PACK_DIR"/*.tgz --ignore-scripts
          node --input-type=module <<'NODE'
          await import('civaria');
          await import('@civaria/headless');
          await import('@civaria/tokens');
          await import('@civaria/a11y');
          await import('@civaria/icons');
          await import('@civaria/core');
          const css = import.meta.resolve('@civaria/css/civaria.css');
          if (!css.includes('civaria.css')) throw new Error(`Unexpected CSS resolution: ${css}`);
          console.log('Packed Civaria ESM/CSS consumer imports: OK');
          NODE
          ./node_modules/.bin/civaria --help
          ./node_modules/.bin/civaria-mcp --help

      - name: Enforce npm registry gate
        if: steps.registry.outcome != 'success'
        run: |
          echo "Packaging and clean-consumer verification passed, but npm bootstrap/ownership/version preflight is still blocked."
          exit 1

  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Civaria brand boundary
        run: pnpm check:brand

      - name: Build packages
        run: pnpm build

      - name: Validate publish tarballs
        run: pnpm -r --filter "./packages/**" exec npm pack --dry-run --json > /dev/null

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select npm authentication mode
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap first Civaria namespace publication
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.npm-auth.outputs.bootstrap == 'true'
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish packages with npm Trusted Publishing
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.npm-auth.outputs.bootstrap == 'false'
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Push release tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push --follow-tags
