name: Publish

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  preflight:
    name: npm Package Preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Validate publish tarballs
        run: pnpm -r --filter "./packages/**" exec npm pack --dry-run --json > /dev/null

  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Validate publish tarballs
        run: pnpm -r --filter "./packages/**" exec npm pack --dry-run --json > /dev/null

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select npm authentication mode
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap first npm publication
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.npm-auth.outputs.bootstrap == 'true'
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish packages with npm Trusted Publishing
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.npm-auth.outputs.bootstrap == 'false'
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Push release tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push --follow-tags
