name: Configure Cloudflare OpenNext

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-cloudflare-opennext.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with owner token
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure OpenNext and Wrangler
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/docs/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          pkg.scripts = {
            ...pkg.scripts,
            'cf:build': 'opennextjs-cloudflare build',
            'cf:deploy': 'opennextjs-cloudflare deploy',
            'preview': 'opennextjs-cloudflare build && opennextjs-cloudflare preview',
            'cf-typegen': 'wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts'
          };

          pkg.dependencies.next = '^15.5.21';
          pkg.devDependencies = {
            ...pkg.devDependencies,
            '@opennextjs/cloudflare': '1.20.2',
            'wrangler': '4.123.0'
          };

          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > apps/docs/wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "weiui",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-18",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

          cat > apps/docs/open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";

          export default defineCloudflareConfig();
          EOF

      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install resolved dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependency closure
        run: pnpm --filter "@weiui/docs..." run build

      - name: Build OpenNext worker output
        working-directory: apps/docs
        run: pnpm run cf:build

      - name: Validate generated Worker output
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/docs/.open-next/worker.js
          test -d apps/docs/.open-next/assets
          git diff --check

      - name: Commit configuration and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xiaooye"
          git config user.email "30093716+xiaooye@users.noreply.github.com"
          git add apps/docs/package.json apps/docs/wrangler.jsonc apps/docs/open-next.config.ts pnpm-lock.yaml
          git commit -m "build: configure Cloudflare OpenNext deployment"
          git push origin HEAD:main
