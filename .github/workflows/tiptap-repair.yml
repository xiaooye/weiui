name: One-time Tiptap Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiptap-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Align all Tiptap packages to one release
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/react/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const name of Object.keys(pkg.dependencies ?? {})) {
            if (name.startsWith('@tiptap/')) pkg.dependencies[name] = '3.30.1';
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "weekly"
              groups:
                tiptap:
                  patterns:
                    - "@tiptap/*"
          YAML

      - name: Resolve lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify docs production build
        run: pnpm --filter "@weiui/docs..." run build

      - name: Commit verified repair
        run: |
          git config user.name "Wei"
          git config user.email "zxcwqer9l@gmail.com"
          git add packages/react/package.json pnpm-lock.yaml .github/dependabot.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Tiptap dependency versions"
          git push origin HEAD:main
