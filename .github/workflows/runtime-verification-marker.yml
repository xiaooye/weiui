name: Materialize runtime verification result

on:
  push:
    branches: [feat/multi-framework-runtime-main]

permissions:
  contents: write

jobs:
  mark:
    if: ${{ !contains(github.event.head_commit.message, 'chore(verify): materialize runtime result') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-framework-runtime-main
      - name: Materialize result
        shell: bash
        run: |
          rm -f .runtime-verification-PASS .runtime-verification-FAIL
          if grep -q '^overall=0$' .runtime-verification.log; then
            echo PASS > .runtime-verification-PASS
          else
            echo FAIL > .runtime-verification-FAIL
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .runtime-verification-PASS .runtime-verification-FAIL
          git commit -m "chore(verify): materialize runtime result"
          git push origin HEAD:feat/multi-framework-runtime-main
