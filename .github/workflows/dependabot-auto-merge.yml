name: Dependabot Auto Merge

on:
  workflow_run:
    workflows:
      - Dependabot Gate
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve eligible Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER="$RUN_PR_NUMBER"

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH" \
              --jq '.[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request associated with this workflow run."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          AUTHOR=$(echo "$PR" | jq -r '.user.login')
          CURRENT_HEAD_SHA=$(echo "$PR" | jq -r '.head.sha')
          STATE=$(echo "$PR" | jq -r '.state')
          DRAFT=$(echo "$PR" | jq -r '.draft')

          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER was opened by $AUTHOR, not Dependabot."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$STATE" != "open" ] || [ "$DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is not an open, ready pull request."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "PR head moved after the successful gate; refusing stale merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Request Dependabot squash merge
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body == "@dependabot squash and merge") | .id' | head -n 1)

          if [ -n "$EXISTING" ]; then
            echo "Dependabot squash-merge command already requested for PR #$PR_NUMBER."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body='@dependabot squash and merge' >/dev/null
          echo "Requested Dependabot squash merge for PR #$PR_NUMBER."
